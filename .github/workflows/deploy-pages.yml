name: Deploy Suhail Medical Dictionary v21 Post-Release 21.18 Account/PWA Cloud Stability

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Phase 1
        run: python verify_phase1.py
      - name: Verify Phase 2
        run: python verify_phase2.py
      - name: Verify Phase 3
        run: python verify_phase3.py
      - name: Verify Phase 4
        run: python verify_phase4.py
      - name: Verify Phase 5
        run: python verify_phase5.py
      - name: Verify Phase 6
        run: python verify_phase6.py
      - name: Verify Phase 7
        run: python verify_phase7.py
      - name: Verify Phase 8
        run: python verify_phase8.py
      - name: Verify Phase 9
        run: python verify_phase9.py
      - name: Verify Phase 10
        run: python verify_phase10.py
      - name: Verify Phase 11
        run: python verify_phase11.py
      - name: Verify Phase 12
        run: python verify_phase12.py
      - name: Verify Phase 13
        run: python verify_phase13.py
      - name: Verify Phase 14 production release
        run: python verify_phase14.py
      - name: Verify Phase 15 responsive shell
        run: python verify_phase15.py
      - name: Verify Phase 16 visual polish
        run: python verify_phase16.py
      - name: Verify Post-Release Cloud Ready QA
        run: |
          python verify_phase17.py
          python verify_phase18.py
          python verify_phase19.py

      - name: Build clean production site
        run: python tools/build_release.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload clean Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
